  .label { font-size: 10px; color: #666; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }

  .meal-sub { font-size: 11px; color: #666; font-family: 'Menlo', monospace; margin-top: 1px; }
  .arrow { color: #666; font-size: 14px; padding: 0 2px; cursor: pointer; }

  .item-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }

  .item-macros { font-size: 10px; margin-top: 1px; }

  .item-remove { background: none; border: none; color: #f87171; font-size: 16px; cursor: pointer; padding: 0 2px; }

// ─── STORAGE ─────────────────────────────────────────────────────────────────
const STORAGE_PREFIX = "tracker:day:";

function saveDay(date, data) {
  localStorage.setItem(STORAGE_PREFIX + date, JSON.stringify(data));
}
function loadDay(date) {
  const raw = localStorage.getItem(STORAGE_PREFIX + date);
  return raw ? JSON.parse(raw) : null;
}
function loadAllDays() {
  const days = [];
  const keys = Object.keys(localStorage).filter(k => k.startsWith(STORAGE_PREFIX));
  keys.forEach(key => {
    try {
      const raw = localStorage.getItem(key);
      if (raw) days.push({ date: key.replace(STORAGE_PREFIX, ""), ...JSON.parse(raw) });
    } catch {}
  });
  return days.sort((a, b) => b.date.localeCompare(a.date));
}

  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
};
function findFood(id) {

    const f = cat.find(x => x.id === id);
    if (f) return f;

  return null;
}
function macrosFromItem(item) {
  const food = findFood(item.catalogId);
  if (!food) return { kcal: 0, prot: 0, carbs: 0, fat: 0 };
  const m = (item.qty || food.base) / food.base;
  return { kcal: food.kcal * m, prot: food.prot * m, carbs: food.carbs * m, fat: food.fat * m };
}
function customTotals(items) {
  return items.reduce((acc, it) => {
    const m = macrosFromItem(it);
    return { kcal: acc.kcal + m.kcal, prot: acc.prot + m.prot, carbs: acc.carbs + m.carbs, fat: acc.fat + m.fat };
  }, { kcal: 0, prot: 0, carbs: 0, fat: 0 });
}
function computeDayTotals(meals) {
  return meals.reduce((acc, m) => {
    if (!m.logged) return acc;
    const t = m.custom ? customTotals(m.items) : { kcal: m.kcal, prot: m.prot, carbs: m.carbs, fat: m.fat };
    return { kcal: acc.kcal + t.kcal, prot: acc.prot + t.prot, carbs: acc.carbs + t.carbs, fat: acc.fat + t.fat };
  }, { kcal: 0, prot: 0, carbs: 0, fat: 0 });
}
function pct(val, target) { return Math.min(100, Math.round((val / target) * 100)); }
function r0(n) { return Math.round(n); }
function r1(n) { return Math.round(n * 10) / 10; }
function fmtDate(d) {
  const parts = d.split("-");
  const months = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  return parseInt(parts[2]) + " " + months[parseInt(parts[1]) - 1];
}
function emptyDay() {
  return {
    meals: PLAN_BASE.map(m => Object.assign({}, m, { logged: false, custom: false, items: [] })),
    weight: "", whoop: "", note: "", steps: "", training: []
  };
}

// ─── STATE ───────────────────────────────────────────────────────────────────
const today = TODAY();
let state = {
  tab: "hoy",
  dayData: loadDay(today) || emptyDay(),
  expandedMeals: {},
  pickerMeal: null,
  pickerSearch: "",
  pickerCat: Object.keys(CATALOGO)[0],
  saved: false
};
// Ensure backward compat
state.dayData.meals = state.dayData.meals.map(m => Object.assign({ items: [] }, m));

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  const totals = computeDayTotals(state.dayData.meals);
  const kcalPct = pct(totals.kcal, TARGETS.kcal);
  const loggedCount = state.dayData.meals.filter(m => m.logged).length;
  const ringColor = kcalPct >= 95 ? "#c8f542" : kcalPct >= 70 ? "#60a5fa" : "#666";
  const r = (52 - 5) / 2;
  const circ = 2 * Math.PI * r;
  const dash = (kcalPct / 100) * circ;

  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="hdr">
      <div class="hdr-row">
        <div>
          <div class="hdr-sub">${fmtDate(today)} · Semana 1</div>
          <div class="hdr-title">TRACKER</div>
        </div>
        <div class="ring">
          <svg width="52" height="52">
            <circle cx="26" cy="26" r="${r}" fill="none" stroke="#333" stroke-width="5"></circle>
            <circle cx="26" cy="26" r="${r}" fill="none" stroke="${ringColor}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${dash} ${circ}"></circle>
          </svg>
          <div class="ring-text" style="color:${ringColor}">${kcalPct}%</div>
        </div>
      </div>
      <div class="tabs">
        <button class="tab ${state.tab === 'hoy' ? 'active' : ''}" data-tab="hoy">Hoy</button>
        <button class="tab ${state.tab === 'historial' ? 'active' : ''}" data-tab="historial">Historial</button>
      </div>
    </div>
    <div class="content">${state.tab === 'hoy' ? renderHoy(totals, loggedCount) : renderHistorial()}</div>
  `;

  bindEvents();
}

function macroBar(val, target, color, label) {
  const p = pct(val, target);
  const over = val > target;
  return `
    <div class="macro-bar-wrap">
      <div class="macro-bar-head">
        <span style="color:#666">${label}</span>
        <span style="font-family:'Menlo',monospace;color:${over ? '#f87171' : color}">${r0(val)}g <span style="color:#666">/ ${target}g</span></span>
      </div>
      <div class="macro-bar-bg"><div class="macro-bar-fill" style="width:${p}%;background:${over ? '#f87171' : color}"></div></div>
    </div>
  `;
}

function renderMeal(meal, idx) {
  const expanded = state.expandedMeals[idx];
  const dt = meal.custom ? customTotals(meal.items) : { kcal: meal.kcal, prot: meal.prot, carbs: meal.carbs, fat: meal.fat };

  return `
    <div class="meal ${meal.logged ? 'logged' : ''}">
      <div class="meal-head">
        <div class="checkbox ${meal.logged ? 'checked' : ''}" data-action="toggle-log" data-idx="${idx}"></div>
        <div class="meal-name" data-action="toggle-expand" data-idx="${idx}">
          <div class="meal-title" style="color:${meal.logged ? '#f2f2f2' : '#666'}">${meal.emoji} ${meal.nombre}</div>
          <div class="meal-sub">${meal.logged ? r0(dt.kcal) + ' kcal' + (meal.custom ? ' · ' + meal.items.length + ' item' + (meal.items.length !== 1 ? 's' : '') : '') : 'Sin registrar'}</div>
        </div>
        ${meal.logged ? `<div class="arrow" data-action="toggle-expand" data-idx="${idx}">${expanded ? '▲' : '▼'}</div>` : ''}
      </div>
      ${meal.logged && expanded ? renderMealBody(meal, idx, dt) : ''}
    </div>
  `;
}

function renderMealBody(meal, idx, dt) {
  let body = `
    <div class="meal-body">
      <div class="custom-toggle">
        <div class="checkbox small ${meal.custom ? 'checked' : ''}" data-action="toggle-custom" data-idx="${idx}"></div>
        <span class="custom-toggle-label">Selección personalizada</span>
      </div>
  `;

  if (!meal.custom) {
    body += `
      <div class="badges">
        <span class="badge" style="background:${C.kcal}18;border:1px solid ${C.kcal}30;color:${C.kcal}">${meal.kcal} kcal</span>
        <span class="badge" style="background:${C.prot}18;border:1px solid ${C.prot}30;color:${C.prot}">P ${meal.prot}g</span>
        <span class="badge" style="background:${C.carbs}18;border:1px solid ${C.carbs}30;color:${C.carbs}">C ${meal.carbs}g</span>
        <span class="badge" style="background:${C.fat}18;border:1px solid ${C.fat}30;color:${C.fat}">G ${meal.fat}g</span>
      </div>
    `;
  } else {
    body += meal.items.map((it, itIdx) => renderItem(it, idx, itIdx)).join("");
    body += `<button class="add-btn" data-action="open-picker" data-idx="${idx}">+ Agregar alimento</button>`;
    if (meal.items.length > 0) {
      body += `
        <div class="total-pill">
          <span class="lab">TOTAL:</span>
          <span class="val" style="color:${C.kcal}">${r0(dt.kcal)} kcal</span>
          <span class="val" style="color:${C.prot}">P ${r0(dt.prot)}g</span>
          <span class="val" style="color:${C.carbs}">C ${r0(dt.carbs)}g</span>
          <span class="val" style="color:${C.fat}">G ${r0(dt.fat)}g</span>
        </div>
      `;
    }
  }
  body += `</div>`;
  return body;
}

function renderItem(item, mealIdx, itemIdx) {
  const food = findFood(item.catalogId);
  if (!food) return "";
  const m = macrosFromItem(item);
  return `
    <div class="item">
      <div class="item-head">
        <div style="flex:1;min-width:0">
          <div class="item-name">${food.nombre}</div>
          <div class="item-macros">
            <span style="color:${C.kcal}">${r0(m.kcal)} kcal</span>
            <span style="color:${C.prot}">P ${r1(m.prot)}</span>
            <span style="color:${C.carbs}">C ${r1(m.carbs)}</span>
            <span style="color:${C.fat}">G ${r1(m.fat)}</span>
          </div>
        </div>
        <button class="item-remove" data-action="remove-item" data-meal="${mealIdx}" data-item="${itemIdx}">✕</button>
      </div>
      <div class="item-qty">
        <input type="number" inputmode="decimal" class="qty-input" data-action="update-qty" data-meal="${mealIdx}" data-item="${itemIdx}" value="${item.qty}">
        <span class="qty-unit">${food.unidad}</span>
      </div>
    </div>
  `;
}

function renderHistorial() {
  const history = loadAllDays().filter(d => d.date !== today);
  if (history.length === 0) {
    return `<div class="empty">Aún no hay días guardados.<br><span style="font-size:11px">Registra y guarda el día de hoy para empezar.</span></div>`;
  }
  let html = `<div class="label" style="margin-bottom:12px">${history.length} días registrados</div>`;

  if (history.length >= 3) {
    const recent = history.slice().reverse().slice(-7);
    const maxKcal = Math.max(...recent.map(d => computeDayTotals(d.meals).kcal), TARGETS.kcal);
    const avg = Math.round(recent.reduce((a, d) => a + computeDayTotals(d.meals).kcal, 0) / recent.length);
    html += `
      <div class="card">
        <div class="label">Calorías últimos días</div>
        <div style="display:flex;gap:6px;align-items:flex-end;height:48px">
          ${recent.map(d => {
            const t = computeDayTotals(d.meals);
            const h = Math.max(4, (t.kcal / maxKcal) * 48);
            const isT = Math.abs(t.kcal - TARGETS.kcal) < 100;
            return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
              <div style="width:100%;height:${h}px;background:${isT ? '#c8f542' : '#60a5fa80'};border-radius:3px"></div>
              <div style="font-size:9px;color:#666;font-family:'Menlo',monospace">${fmtDate(d.date).split(' ')[0]}</div>
            </div>`;
          }).join("")}
        </div>
        <div style="font-size:10px;color:#666;margin-top:8px">Promedio: <span style="color:#c8f542;font-family:'Menlo',monospace">${avg} kcal</span></div>
      </div>
    `;
  }

  html += history.map(d => {
    const t = computeDayTotals(d.meals);
    const wc = d.whoop ? (WHOOP_COLORS[d.whoop] || '#666') : '#666';
    return `
      <div class="hist-row">
        <div class="hist-hd">
          <span class="hist-date">${fmtDate(d.date)}</span>
          <div style="display:flex;gap:8px;align-items:center">
            ${d.weight ? `<span style="font-size:11px;color:#666;font-family:'Menlo',monospace">${d.weight} kg</span>` : ''}
            ${d.whoop ? `<span style="font-size:10px;color:${wc};font-family:'Menlo',monospace">● ${d.whoop.split(' ')[0]}</span>` : ''}
            <button class="delete-day-btn" data-action="delete-day" data-date="${d.date}" title="Borrar día">🗑</button>
          </div>
        </div>
        <div class="hist-macros">
          <div><div style="font-size:9px;color:#666">kcal</div><div class="hist-macro-val" style="color:${C.kcal}">${r0(t.kcal)}</div></div>
          <div><div style="font-size:9px;color:#666">P</div><div class="hist-macro-val" style="color:${C.prot}">${r0(t.prot)}g</div></div>
          <div><div style="font-size:9px;color:#666">C</div><div class="hist-macro-val" style="color:${C.carbs}">${r0(t.carbs)}g</div></div>
          <div><div style="font-size:9px;color:#666">G</div><div class="hist-macro-val" style="color:${C.fat}">${r0(t.fat)}g</div></div>
        </div>
        ${(d.training && d.training.length) ? `<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">${d.training.map(tid => { const opt = TRAINING_OPTIONS.find(o => o.id === tid); return opt ? `<span style="font-size:10px;background:#333;border-radius:4px;padding:2px 6px;color:#aaa">${opt.emoji} ${opt.label}</span>` : ''; }).join("")}</div>` : ''}
        ${d.steps ? `<div style="font-size:11px;color:#666;margin-top:6px;font-family:'Menlo',monospace">👟 ${parseInt(d.steps).toLocaleString()} pasos</div>` : ''}
        ${d.note ? `<div class="hist-note">${d.note}</div>` : ''}
      </div>
    `;
  }).join("");
  return html;
}

// ─── PICKER ──────────────────────────────────────────────────────────────────
function renderPicker() {
  if (state.pickerMeal === null) return;
  const search = state.pickerSearch.toLowerCase();
  let filtered;
  if (search) {
    filtered = {};
    Object.entries(CATALOGO).forEach(([cat, items]) => {
      const f = items.filter(i => i.nombre.toLowerCase().includes(search));
      if (f.length) filtered[cat] = f;
    });
  } else {
    filtered = { [state.pickerCat]: CATALOGO[state.pickerCat] };
  }

  let html = `
    <div class="picker-overlay">
      <div class="picker">
        <div class="picker-hd">
          <div class="picker-title">CATÁLOGO</div>
          <button class="picker-close" data-action="close-picker">✕</button>
        </div>
        <div class="picker-search">
          <input type="text" id="picker-search" class="field-select" style="font-size:13px" placeholder="Buscar alimento..." value="${state.pickerSearch}">
        </div>
        ${!search ? `
          <div class="cat-tabs">
            ${Object.keys(CATALOGO).map(cat =>
              `<button class="cat-tab ${state.pickerCat === cat ? 'active' : ''}" data-action="cat-tab" data-cat="${cat}">${cat}</button>`
            ).join("")}
          </div>` : ''}
        <div class="food-list">
          ${Object.entries(filtered).map(([cat, items]) => `
            ${search ? `<div class="food-cat-label">${cat}</div>` : ''}
            ${items.map(f => `
              <button class="food-btn" data-action="pick-food" data-food="${f.id}">
                <div style="flex:1;min-width:0">
                  <div class="food-name">${f.nombre}</div>
                  <div class="food-info">${f.base} ${f.unidad} · ${f.kcal} kcal · P ${f.prot}g</div>
                </div>
                <span class="food-add">+</span>
              </button>
            `).join("")}
          `).join("") || `<div class="empty">Sin resultados</div>`}
        </div>
      </div>
    </div>
  `;

  let pickerEl = document.getElementById("picker-root");
  if (!pickerEl) {
    pickerEl = document.createElement("div");
    pickerEl.id = "picker-root";
    document.body.appendChild(pickerEl);
  }
  pickerEl.innerHTML = html;
  bindPickerEvents();
}

function closePicker() {
  state.pickerMeal = null;
  state.pickerSearch = "";
  const el = document.getElementById("picker-root");
  if (el) el.remove();
}

// ─── EVENTS ──────────────────────────────────────────────────────────────────
function bindEvents() {
  document.querySelectorAll("[data-tab]").forEach(b => {
    b.onclick = () => { state.tab = b.dataset.tab; render(); };
  });

  document.querySelectorAll("[data-action]").forEach(el => {
    const action = el.dataset.action;
    if (action === "toggle-log") {
      el.onclick = () => {
        const i = +el.dataset.idx;
        const m = state.dayData.meals[i];
        m.logged = !m.logged;
        if (!m.logged) { m.custom = false; m.items = []; }
        state.saved = false;
        render();
      };
    } else if (action === "toggle-expand") {
      el.onclick = () => {
        const i = +el.dataset.idx;
        if (state.dayData.meals[i].logged) {
          state.expandedMeals[i] = !state.expandedMeals[i];
          render();
        }
      };
    } else if (action === "toggle-custom") {
      el.onclick = () => {
        const i = +el.dataset.idx;
        state.dayData.meals[i].custom = !state.dayData.meals[i].custom;
        state.expandedMeals[i] = true;
        state.saved = false;
        render();
      };
    } else if (action === "open-picker") {
      el.onclick = () => {
        state.pickerMeal = +el.dataset.idx;
        state.pickerSearch = "";
        state.pickerCat = Object.keys(CATALOGO)[0];
        renderPicker();
      };
    } else if (action === "toggle-training") {
      el.onclick = () => {
        const tid = el.dataset.tid;
        let training = [...(state.dayData.training || [])];
        // Descanso is exclusive
        if (tid === "descanso") {
          training = training.includes("descanso") ? [] : ["descanso"];
        } else {
          // Remove descanso if selecting anything else
          training = training.filter(t => t !== "descanso");
          if (training.includes(tid)) {
            training = training.filter(t => t !== tid);
          } else {
            training.push(tid);
          }
        }
        state.dayData.training = training;
        state.saved = false;
        render();
      };
    } else if (action === "delete-day") {
      el.onclick = () => {
        const date = el.dataset.date;
        const label = fmtDate(date);
        if (confirm('¿Borrar el día ' + label + '? Esta acción no se puede deshacer.')) {
          localStorage.removeItem(STORAGE_PREFIX + date);
          showToast('Día ' + label + ' borrado');
          render();
        }
      };
    } else if (action === "remove-item") {
      el.onclick = () => {
        const mi = +el.dataset.meal;
        const ii = +el.dataset.item;
        state.dayData.meals[mi].items.splice(ii, 1);
        state.saved = false;
        render();
      };
    } else if (action === "update-qty") {
      el.onchange = () => {
        const mi = +el.dataset.meal;
        const ii = +el.dataset.item;
        state.dayData.meals[mi].items[ii].qty = parseFloat(el.value) || 0;
        state.saved = false;
        render();
      };
    }
  });

  const w = document.getElementById("weight");
  if (w) w.onchange = () => { state.dayData.weight = w.value; state.saved = false; };
  const wh = document.getElementById("whoop");
  if (wh) wh.onchange = () => { state.dayData.whoop = wh.value; state.saved = false; render(); };
  const n = document.getElementById("note");
  if (n) n.onchange = () => { state.dayData.note = n.value; state.saved = false; };

  const sb = document.getElementById("save-btn");
  if (sb) sb.onclick = () => {
    const wi = document.getElementById("weight");
    const ni = document.getElementById("note");
    const whi = document.getElementById("whoop");
    if (wi) state.dayData.weight = wi.value;
    if (ni) state.dayData.note = ni.value;
    if (whi) state.dayData.whoop = whi.value;
    const si = document.getElementById("steps");
    if (si) state.dayData.steps = si.value;
    saveDay(today, state.dayData);
    state.saved = true;
    render();
    showToast("Día guardado ✓");
    setTimeout(() => { state.saved = false; }, 2500);
  };

  const eb = document.getElementById("export-btn");
  if (eb) eb.onclick = exportData;
  const ib = document.getElementById("import-btn");
  if (ib) ib.onclick = () => document.getElementById("import-file").click();
  const ifi = document.getElementById("import-file");
  if (ifi) ifi.onchange = importData;
}

function bindPickerEvents() {
  document.querySelectorAll("[data-action='close-picker']").forEach(b => b.onclick = closePicker);
  document.querySelectorAll("[data-action='cat-tab']").forEach(b => {
    b.onclick = () => { state.pickerCat = b.dataset.cat; renderPicker(); };
  });
  document.querySelectorAll("[data-action='pick-food']").forEach(b => {
    b.onclick = () => {
      const food = findFood(b.dataset.food);
      if (!food) return;
      const mi = state.pickerMeal;
      state.dayData.meals[mi].items.push({ catalogId: food.id, qty: food.base });
      state.saved = false;
      closePicker();
      render();
    };
  });
  const ps = document.getElementById("picker-search");
  if (ps) {
    ps.oninput = () => { state.pickerSearch = ps.value; renderPicker(); document.getElementById("picker-search").focus(); };
  }
}

// ─── BACKUP ──────────────────────────────────────────────────────────────────
function exportData() {
  const all = loadAllDays();
  const blob = new Blob([JSON.stringify({ exported: new Date().toISOString(), days: all }, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `tracker-backup-${TODAY()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast("Backup descargado");
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.days || !Array.isArray(data.days)) throw new Error("Formato inválido");
      if (!confirm(`Importar ${data.days.length} días? Los días que ya existen serán sobrescritos.`)) return;
      data.days.forEach(d => {
        const { date, ...rest } = d;
        if (date) saveDay(date, rest);
      });
      state.dayData = loadDay(today) || emptyDay();
      state.dayData.meals = state.dayData.meals.map(m => Object.assign({ items: [] }, m));
      render();
      showToast(`${data.days.length} días importados`);
    } catch (err) {
      alert("Error al importar: " + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = "";
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

// ─── INIT ────────────────────────────────────────────────────────────────────
render();

// Service worker for PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
