<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<script src="https://accounts.google.com/gsi/client" async defer></script>

<title>Tracker</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
html, body {
  background: #f5f5f5; color: #111;
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  min-height: 100vh;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}
input, textarea, select, button { font-family: inherit; color: inherit; }
input[type=number] { -moz-appearance: textfield; }
input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; }

.app { max-width: 480px; margin: 0 auto; }

/* HEADER */
.hdr {
  background: #fff;
  padding: 18px 20px 0;
  border-bottom: 1px solid #e8e8e8;
  position: sticky; top: 0; z-index: 10;
}
.hdr-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.hdr-title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
.hdr-date { font-size: 12px; color: #999; font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 0; }
.tab {
  flex: 1; background: none; border: none; padding: 10px 0; font-size: 12px;
  font-weight: 500; color: #aaa; border-bottom: 2px solid transparent; cursor: pointer;
  letter-spacing: 0.3px; transition: all 0.15s;
}
.tab.active { color: #111; font-weight: 700; border-bottom-color: #111; }

/* CONTENT */
.content { padding: 16px 20px 100px; }

/* CARDS */
.card {
  background: #fff; border: 1px solid #e8e8e8;
  border-radius: 12px; padding: 16px; margin-bottom: 12px;
}
.card-title {
  font-size: 10px; font-weight: 700; color: #aaa;
  letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 14px;
}

/* SUMMARY */
.summary-grid { display: flex; gap: 0; }
.summary-kcal { min-width: 80px; padding-right: 16px; border-right: 1px solid #f0f0f0; margin-right: 16px; }
.kcal-num { font-size: 28px; font-weight: 700; letter-spacing: -1px; color: #111; line-height: 1; }
.kcal-target { font-size: 11px; color: #bbb; margin-top: 3px; font-variant-numeric: tabular-nums; }
.summary-bars { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 7px; }
.bar-row { display: flex; align-items: center; gap: 8px; }
.bar-label { font-size: 10px; color: #aaa; width: 14px; font-weight: 600; }
.bar-track { flex: 1; height: 4px; background: #f0f0f0; border-radius: 2px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
.bar-val { font-size: 10px; color: #999; width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
.logged-count { font-size: 11px; color: #bbb; margin-top: 12px; }

/* MEALS */
.meal {
  border: 1px solid #ebebeb; border-radius: 10px;
  margin-bottom: 8px; overflow: hidden; background: #fff;
  transition: border-color 0.15s;
}
.meal.logged { border-color: #111; }
.meal-head { display: flex; align-items: center; padding: 12px 14px; gap: 12px; }
.cb {
  width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid #ddd;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; transition: all 0.15s; background: #fff;
}
.cb.on { background: #111; border-color: #111; }
.cb.on::after { content: ''; display: block; width: 5px; height: 9px; border: 2px solid #fff; border-top: none; border-left: none; transform: rotate(45deg) translate(-1px, -1px); }
.cb.sm { width: 16px; height: 16px; border-radius: 4px; }
.cb.sm.on::after { width: 4px; height: 7px; }
.meal-info { flex: 1; cursor: pointer; }
.meal-name { font-size: 13px; font-weight: 600; color: #111; }
.meal-name.off { color: #bbb; font-weight: 500; }
.meal-sub { font-size: 11px; color: #bbb; margin-top: 1px; font-variant-numeric: tabular-nums; }
.chevron { color: #ccc; font-size: 12px; cursor: pointer; padding: 0 2px; }

.meal-body { padding: 0 14px 14px; border-top: 1px solid #f5f5f5; }
.custom-row { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
.custom-label { font-size: 12px; color: #aaa; }

.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge {
  font-size: 11px; border-radius: 5px; padding: 3px 8px;
  font-variant-numeric: tabular-nums; letter-spacing: 0;
}

/* ITEMS */
.item {
  background: #fafafa; border: 1px solid #efefef;
  border-radius: 8px; padding: 10px 12px; margin-bottom: 6px;
}
.item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.item-name { font-size: 12px; font-weight: 600; }
.item-macros { font-size: 10px; color: #aaa; margin-top: 2px; font-variant-numeric: tabular-nums; }
.item-remove { background: none; border: none; color: #ccc; font-size: 14px; cursor: pointer; padding: 0; line-height: 1; }
.item-qty { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.qty-in {
  width: 72px; background: #fff; border: 1px solid #e0e0e0;
  border-radius: 6px; padding: 5px 8px; font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.qty-unit { font-size: 11px; color: #aaa; }

.add-food-btn {
  width: 100%; background: #fff; border: 1.5px dashed #ddd;
  color: #aaa; border-radius: 8px; padding: 10px; font-size: 12px;
  font-weight: 600; cursor: pointer; margin-top: 4px; letter-spacing: 0.3px;
}
.add-food-btn:active { background: #f9f9f9; }

.total-row {
  margin-top: 10px; padding: 8px 10px; background: #f7f7f7;
  border-radius: 7px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
}
.total-lab { font-size: 10px; color: #aaa; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
.total-val { font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* FIELDS */
.field-label { font-size: 10px; font-weight: 700; color: #aaa; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px; }
.field-in {
  width: 100%; background: #fff; border: 1px solid #e8e8e8;
  border-radius: 8px; padding: 10px 12px; font-size: 15px; color: #111;
  font-variant-numeric: tabular-nums;
}
.field-in:focus { outline: none; border-color: #111; }
.field-sel {
  width: 100%; background: #fff; border: 1px solid #e8e8e8;
  border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #111;
  appearance: none; -webkit-appearance: none;
}
.field-ta {
  width: 100%; background: #fff; border: 1px solid #e8e8e8;
  border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #111;
  resize: none; line-height: 1.6;
}
.field-ta:focus, .field-sel:focus, .field-in:focus { outline: none; border-color: #111; }

/* WATER */
.water-row { display: flex; align-items: center; gap: 12px; }
.water-dots { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.water-dot {
  width: 28px; height: 28px; border-radius: 50%;
  border: 1.5px solid #ddd; background: #fff; cursor: pointer;
  transition: all 0.15s; display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: #ccc; font-weight: 700;
}
.water-dot.filled { background: #111; border-color: #111; color: #fff; }
.water-label { font-size: 12px; color: #aaa; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* TRAINING CHIPS */
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  padding: 7px 12px; border-radius: 7px; border: 1.5px solid #e8e8e8;
  background: #fff; color: #aaa; font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.15s; user-select: none; -webkit-user-select: none;
}
.chip.on { border-color: #111; background: #111; color: #fff; font-weight: 600; }
.chip.rest.on { border-color: #aaa; background: #fafafa; color: #555; }

/* SAVE */
.save-btn {
  width: 100%; margin-top: 14px; padding: 14px;
  background: #111; color: #fff; font-weight: 700; font-size: 14px;
  letter-spacing: 0.5px; border: none; border-radius: 10px; cursor: pointer;
  transition: opacity 0.15s;
}
.save-btn:active { opacity: 0.8; }
.save-btn.saved { background: #555; }

/* BACKUP */
.backup-row { display: flex; gap: 8px; margin-top: 10px; }
.backup-btn {
  flex: 1; background: #fff; border: 1px solid #e8e8e8;
  color: #555; border-radius: 8px; padding: 11px; font-size: 12px;
  font-weight: 600; cursor: pointer; letter-spacing: 0.3px;
}

/* PICKER */
.picker-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 100;
  display: flex; flex-direction: column; padding: 60px 0 0;
}
.picker {
  background: #fff; border-radius: 16px 16px 0 0;
  flex: 1; display: flex; flex-direction: column;
  max-width: 480px; width: 100%; margin: 0 auto; overflow: hidden;
}
.picker-hd {
  padding: 16px 20px; border-bottom: 1px solid #f0f0f0;
  display: flex; align-items: center; justify-content: space-between;
}
.picker-title { font-size: 15px; font-weight: 700; }
.picker-close { background: none; border: none; font-size: 20px; color: #aaa; cursor: pointer; padding: 0; line-height: 1; }
.picker-search-wrap { padding: 10px 20px; }
.picker-search {
  width: 100%; background: #f5f5f5; border: none;
  border-radius: 8px; padding: 9px 12px; font-size: 14px; color: #111;
}
.picker-search:focus { outline: none; }
.cat-tabs { display: flex; gap: 6px; padding: 0 20px 10px; overflow-x: auto; white-space: nowrap; }
.cat-tab {
  background: #f5f5f5; color: #888; border: none;
  border-radius: 6px; padding: 5px 10px; font-size: 11px;
  font-weight: 500; cursor: pointer; flex-shrink: 0; transition: all 0.15s;
}
.cat-tab.on { background: #111; color: #fff; font-weight: 700; }
.food-list { flex: 1; overflow-y: auto; padding: 0 20px 20px; -webkit-overflow-scrolling: touch; }
.food-cat-label { font-size: 10px; font-weight: 700; color: #bbb; letter-spacing: 1.5px; text-transform: uppercase; margin: 14px 0 8px; }
.food-btn {
  width: 100%; text-align: left; background: #fafafa; border: 1px solid #efefef;
  border-radius: 8px; padding: 11px 12px; margin-bottom: 6px; cursor: pointer;
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  transition: background 0.1s;
}
.food-btn:active { background: #f0f0f0; }
.food-fname { font-size: 13px; font-weight: 600; color: #111; }
.food-finfo { font-size: 10px; color: #aaa; margin-top: 2px; font-variant-numeric: tabular-nums; }
.food-add { color: #111; font-size: 18px; font-weight: 300; line-height: 1; }

/* REFERENCE TABS */
.ref-section { margin-bottom: 20px; }
.ref-title { font-size: 13px; font-weight: 700; color: #111; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #ebebeb; }
.ref-day { margin-bottom: 12px; }
.ref-day-name { font-size: 11px; font-weight: 700; color: #aaa; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
.ref-row {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 7px 0; border-bottom: 1px solid #f5f5f5; gap: 12px;
}
.ref-row:last-child { border-bottom: none; }
.ref-food { font-size: 13px; color: #333; }
.ref-qty { font-size: 12px; color: #aaa; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ref-macros { font-size: 10px; color: #bbb; margin-top: 1px; font-variant-numeric: tabular-nums; }

/* HISTORY */
.hist-row {
  background: #fff; border: 1px solid #ebebeb;
  border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
}
.hist-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.hist-date { font-size: 13px; font-weight: 700; color: #111; }
.hist-del { background: none; border: none; font-size: 14px; color: #ddd; cursor: pointer; padding: 0; }
.hist-macros { display: flex; gap: 14px; margin-bottom: 6px; }
.hist-m-label { font-size: 9px; color: #bbb; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.hist-m-val { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.hist-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
.hist-tag { font-size: 10px; background: #f5f5f5; color: #777; border-radius: 4px; padding: 2px 7px; }
.hist-meta { display: flex; gap: 12px; margin-top: 6px; }
.hist-meta-item { font-size: 11px; color: #aaa; font-variant-numeric: tabular-nums; }
.hist-note { font-size: 11px; color: #aaa; margin-top: 6px; padding-top: 6px; border-top: 1px solid #f5f5f5; }

/* CHART */
.chart-wrap { margin-bottom: 4px; }
.chart-bars { display: flex; gap: 5px; align-items: flex-end; height: 52px; }
.chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.chart-bar { width: 100%; border-radius: 3px; transition: height 0.3s; }
.chart-lbl { font-size: 9px; color: #bbb; font-variant-numeric: tabular-nums; }
.chart-avg { font-size: 11px; color: #aaa; margin-top: 8px; }

/* TOAST */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #111; color: #fff; padding: 10px 20px; border-radius: 8px;
  font-size: 13px; font-weight: 600; z-index: 200;
  opacity: 0; transition: opacity 0.25s; pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; }

.empty { text-align: center; color: #bbb; font-size: 13px; padding: 60px 20px; line-height: 1.8; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mt12 { margin-top: 12px; }
.mt8 { margin-top: 8px; }
</style>
</head>

function getCurrentWeek() {
  const now = new Date();
  const diff = Math.floor((now - START_DATE) / (1000*60*60*24));
  const week = Math.floor(diff / 7) + 1;
  return Math.max(1, week);
}
function getWeekTargets() {
  const w = getCurrentWeek();
  if (w === 1) return { kcal:2142, prot:228, carbs:201, fat:39, label:"Semana 1", desc:"Reactivacion metabolica" };
  if (w === 2) return { kcal:2300, prot:228, carbs:220, fat:39, label:"Semana 2", desc:"Normalizacion hormonal" };
  if (w === 3) return { kcal:2400, prot:228, carbs:235, fat:40, label:"Semana 3", desc:"Mantenimiento real" };
  return { kcal:2600, prot:228, carbs:255, fat:42, label:"Semana "+ w, desc:"Volumen limpio" };
}

// ─── AUTH ─────────────────────────────────────────────────────────────────────
let tokenClient = null;
let gTokenExpiry = 0;

function getTokenClient() {
  if (!tokenClient) {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: () => {},
    });
  }
  return tokenClient;
}

function gsignIn() {
  return new Promise((resolve, reject) => {
    const client = getTokenClient();
    client.callback = (resp) => {
      if (resp.error) { reject(new Error(resp.error)); return; }
      gToken = resp.access_token;
      gTokenExpiry = Date.now() + ((resp.expires_in || 3600) - 60) * 1000;
      resolve(resp.access_token);
    };
    client.requestAccessToken({ prompt: "" });
  });
}

async function ensureAuth() {
  if (gToken && Date.now() < gTokenExpiry) return gToken;
  await gsignIn();
  return gToken;
}

// ─── SHEETS API ───────────────────────────────────────────────────────────────
async function sheetsGet(range) {
  const token = await ensureAuth();
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}`;
  const r = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
  if (!r.ok) throw new Error("Sheets GET failed: " + r.status);
  return r.json();
}

async function sheetsAppend(range, values) {
  const token = await ensureAuth();
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`;
  const r = await fetch(url, {
    method: "POST",
    headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
    body: JSON.stringify({ values }),
  });
  if (!r.ok) throw new Error("Sheets APPEND failed: " + r.status);
  return r.json();
}

async function sheetsUpdate(range, values) {
  const token = await ensureAuth();
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}?valueInputOption=RAW`;
  const r = await fetch(url, {
    method: "PUT",
    headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
    body: JSON.stringify({ values }),
  });
  if (!r.ok) throw new Error("Sheets UPDATE failed: " + r.status);
  return r.json();
}

async function sheetsClear(range) {
  const token = await ensureAuth();
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}:clear`;
  const r = await fetch(url, {
    method: "POST",
    headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
  });
  if (!r.ok) throw new Error("Sheets CLEAR failed: " + r.status);
  return r.json();
}

// ─── STORAGE ─────────────────────────────────────────────────────────────────
// Each row in Sheets: [date, json_data]
// Sheet headers: Date | Data

async function ensureHeaders() {
  try {
    const res = await sheetsGet(`${SHEET_NAME}!A1`);
    if (!res.values || res.values[0][0] !== "Date") {
      await sheetsUpdate(`${SHEET_NAME}!A1:B1`, [["Date","Data"]]);
    }
  } catch {}
}

async function saveDay(date, data) {
  // Also save to localStorage as offline cache
  localStorage.setItem("tracker:day:" + date, JSON.stringify(data));
  try {
    await ensureAuth();
    const payload = JSON.stringify(data);
    // Check if row exists
    const res = await sheetsGet(`${SHEET_NAME}!A:A`);
    const rows = res.values || [];
    const rowIdx = rows.findIndex(r => r[0] === date);
    if (rowIdx === -1) {
      // Append new row
      await sheetsAppend(`${SHEET_NAME}!A:B`, [[date, payload]]);
    } else {
      // Update existing row (rowIdx+1 because sheets is 1-indexed)
      await sheetsUpdate(`${SHEET_NAME}!A${rowIdx+1}:B${rowIdx+1}`, [[date, payload]]);
    }
  } catch (e) {
    console.warn("Sheets save failed, data in localStorage:", e);
  }
}

async function loadDay(date) {
  try {
    await ensureAuth();
    const res = await sheetsGet(`${SHEET_NAME}!A:B`);
    const rows = res.values || [];
    const row = rows.find(r => r[0] === date);
    if (row && row[1]) return JSON.parse(row[1]);
  } catch {}
  // Fallback to localStorage
  try { const r = localStorage.getItem("tracker:day:" + date); return r ? JSON.parse(r) : null; } catch { return null; }
}

async function loadAllDays() {
  try {
    await ensureAuth();
    const res = await sheetsGet(`${SHEET_NAME}!A:B`);
    const rows = (res.values || []).filter(r => r[0] && r[0] !== "Date" && r[1]);
    return rows
      .map(r => { try { return { date: r[0], ...JSON.parse(r[1]) }; } catch { return null; } })
      .filter(Boolean)
      .sort((a,b) => b.date.localeCompare(a.date));
  } catch {}
  // Fallback to localStorage
  const days = [];
  Object.keys(localStorage).filter(k => k.startsWith("tracker:day:")).forEach(k => {
    try { const r = localStorage.getItem(k); if (r) days.push({ date: k.replace("tracker:day:",""), ...JSON.parse(r) }); } catch {}
  });
  return days.sort((a,b) => b.date.localeCompare(a.date));
}

async function deleteDay(date) {
  localStorage.removeItem("tracker:day:" + date);
  try {
    await ensureAuth();
    const res = await sheetsGet(`${SHEET_NAME}!A:A`);
    const rows = res.values || [];
    const rowIdx = rows.findIndex(r => r[0] === date);
    if (rowIdx !== -1) {
      await sheetsClear(`${SHEET_NAME}!A${rowIdx+1}:B${rowIdx+1}`);
    }
  } catch (e) { console.warn("Sheets delete failed:", e); }
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function TODAY() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function YESTERDAY() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function findFood(id) { for (const cat of Object.values(CATALOGO)) { const f = cat.find(x=>x.id===id); if(f) return f; } return null; }
function macrosFromItem(it) {
  const f = findFood(it.catalogId); if(!f) return {kcal:0,prot:0,carbs:0,fat:0};
  const m = (it.qty||f.base)/f.base;
  return {kcal:f.kcal*m, prot:f.prot*m, carbs:f.carbs*m, fat:f.fat*m};
}
function customTotals(items) {
  return items.reduce((a,it)=>{ const m=macrosFromItem(it); return {kcal:a.kcal+m.kcal,prot:a.prot+m.prot,carbs:a.carbs+m.carbs,fat:a.fat+m.fat}; },{kcal:0,prot:0,carbs:0,fat:0});
}
function dayTotals(meals) {
  return meals.reduce((a,m)=>{ if(!m.logged) return a; const t=m.custom?customTotals(m.items):{kcal:m.kcal,prot:m.prot,carbs:m.carbs,fat:m.fat}; return {kcal:a.kcal+t.kcal,prot:a.prot+t.prot,carbs:a.carbs+t.carbs,fat:a.fat+t.fat}; },{kcal:0,prot:0,carbs:0,fat:0});
}
function pct(v,t) { return Math.min(100,Math.round((v/t)*100)); }
function r0(n) { return Math.round(n); }
function r1(n) { return Math.round(n*10)/10; }
function fmtDate(d) {
  const p=d.split("-"), months=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  return parseInt(p[2])+" "+months[parseInt(p[1])-1];
}

}

            `<span style="font-size:11px;font-weight:600;color:#b45309;background:#fff8e1;border:1px solid #ffe082;border-radius:6px;padding:3px 8px">Editando ayer</span>
             <button data-action="switch-date" data-date="${todayStr}" style="background:none;border:none;font-size:11px;color:#111;font-weight:700;cursor:pointer;text-decoration:underline">Volver a hoy</button>`
            :
            `<span></span>
             <button data-action="switch-date" data-date="${yesterdayStr}" style="background:none;border:1px solid #e8e8e8;border-radius:6px;padding:4px 10px;font-size:11px;color:#999;cursor:pointer">Editar ayer</button>`
          }
        </div>` : ''}
      <div class="tabs">
        ${["hoy","dieta","entreno","historial"].map(t=>`
          <button class="tab ${S.tab===t?'active':''}" data-tab="${t}">
            ${t==="hoy"?"Hoy":t==="dieta"?"Dieta":t==="entreno"?"Entreno":"Historial"}
          </button>`).join("")}
      </div>
    </div>
    <div class="content">
      ${S.tab==="hoy"    ? renderHoy(totals,kcalPct)
      : S.tab==="dieta"  ? renderDieta()
      : S.tab==="entreno"? renderEntreno()
      :                    renderHistorial()}
    </div>
  `;
  bindEvents();
  if(S.picker!==null) renderPicker();
}

// ─── HOY ─────────────────────────────────────────────────────────────────────

  return `

    </div>

      <div>

    <div class="mt12">
      <div class="field-label">HRV (ms)</div>

      <input type="file" id="import-file" accept=".json" style="display:none">
    </div>
    <div style="text-align:center;margin-top:8px;font-size:10px;color:#bbb">Datos guardados en Google Sheets</div>

function barRow(label, val, target, color) {
  const p = pct(val, target);
  const over = val > target;
  return `
    <div class="bar-row">
      <div class="bar-label" style="color:${over?'#dc2626':color}">${label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${p}%;background:${over?'#dc2626':color}"></div></div>
      <div class="bar-val" style="color:${over?'#dc2626':'#999'}">${r0(val)}/${target}g</div>
    </div>`;
}

function renderWater() {
  const w = S.day.water || 0;
  const ml = w * 250;
  let dots = '';
  for(let i=1; i<=WATER_GOAL; i++){
    dots += `<div class="water-dot ${i<=w?'filled':''}" data-action="water" data-v="${i}">${i}</div>`;
  }
  return `<div class="water-row"><div class="water-dots">${dots}</div><div class="water-label">${ml} / 3000 ml</div></div>`;
}

function renderMeal(meal, idx) {
  const exp = S.expanded[idx];
  const dt = meal.custom ? customTotals(meal.items) : {kcal:meal.kcal,prot:meal.prot,carbs:meal.carbs,fat:meal.fat};
  return `
    <div class="meal ${meal.logged?'logged':''}">
      <div class="meal-head">
        <div class="cb ${meal.logged?'on':''}" data-action="toggle-log" data-idx="${idx}"></div>
        <div class="meal-info" data-action="expand" data-idx="${idx}">
          <div class="meal-name ${meal.logged?'':'off'}">${meal.nombre}</div>
          <div class="meal-sub">${meal.logged ? r0(dt.kcal)+' kcal'+(meal.custom?' · '+meal.items.length+' items':'') : 'Sin registrar'}</div>
        </div>
        ${meal.logged ? `<div class="chevron" data-action="expand" data-idx="${idx}">${exp?'▲':'▼'}</div>` : ''}
      </div>
      ${meal.logged && exp ? renderMealBody(meal,idx,dt) : ''}
    </div>`;
}

function renderMealBody(meal, idx, dt) {
  let html = `<div class="meal-body">
    <div class="custom-row">
      <div class="cb sm ${meal.custom?'on':''}" data-action="toggle-custom" data-idx="${idx}"></div>
      <span class="custom-label">Seleccion personalizada</span>
    </div>`;
  if(!meal.custom) {
    html += `<div class="badges">
      <span class="badge" style="background:#f0fdf4;color:#16a34a">${meal.kcal} kcal</span>
      <span class="badge" style="background:#f0fdf4;color:#16a34a">P ${meal.prot}g</span>
      <span class="badge" style="background:#eff6ff;color:#2563eb">C ${meal.carbs}g</span>
      <span class="badge" style="background:#fffbeb;color:#d97706">G ${meal.fat}g</span>
    </div>`;
  } else {
    html += meal.items.map((it,ii)=>renderItem(it,idx,ii)).join("");
    html += `<button class="add-food-btn" data-action="open-picker" data-idx="${idx}">+ Agregar alimento</button>`;
    if(meal.items.length>0) {
      html += `<div class="total-row">
        <span class="total-lab">Total</span>
        <span class="total-val" style="color:#111">${r0(dt.kcal)} kcal</span>
        <span class="total-val" style="color:#16a34a">P ${r0(dt.prot)}g</span>
        <span class="total-val" style="color:#2563eb">C ${r0(dt.carbs)}g</span>
        <span class="total-val" style="color:#d97706">G ${r0(dt.fat)}g</span>
      </div>`;
    }
  }
  html += '</div>';
  return html;
}

function renderItem(item, mi, ii) {
  const f = findFood(item.catalogId); if(!f) return '';
  const m = macrosFromItem(item);
  return `
    <div class="item">
      <div class="item-top">
        <div>
          <div class="item-name">${f.nombre}</div>
          <div class="item-macros">${r0(m.kcal)} kcal &nbsp; P ${r1(m.prot)} &nbsp; C ${r1(m.carbs)} &nbsp; G ${r1(m.fat)}</div>
        </div>
        <button class="item-remove" data-action="remove-item" data-meal="${mi}" data-item="${ii}">×</button>
      </div>
      <div class="item-qty">

}

// ─── HISTORIAL ───────────────────────────────────────────────────────────────
function renderHistorial() {
  const TARGETS = getWeekTargets();
  const history = loadAllDays().filter(d=>d.date!==today);
  if(!history.length) return `<div class="empty">Sin dias guardados.<br><span style="font-size:12px">Guarda el dia de hoy para empezar.</span></div>`;

  let html = '';

  // Chart
  if(history.length >= 2) {
    const recent = [...history].reverse().slice(-7);
    const maxK = Math.max(...recent.map(d=>dayTotals(d.meals).kcal), TARGETS.kcal);
    const avg = Math.round(recent.reduce((a,d)=>a+dayTotals(d.meals).kcal,0)/recent.length);
    html += `<div class="card">
      <div class="card-title">Calorias recientes</div>
      <div class="chart-bars">
        ${recent.map(d=>{
          const t=dayTotals(d.meals);
          const h=Math.max(4,(t.kcal/maxK)*52);
          const onTarget=Math.abs(t.kcal-TARGETS.kcal)<150;
          return `<div class="chart-col">
            <div class="chart-bar" style="height:${h}px;background:${onTarget?'#111':'#ddd'}"></div>
            <div class="chart-lbl">${fmtDate(d.date).split(' ')[0]}</div>
          </div>`;
        }).join("")}
      </div>
      <div class="chart-avg">Promedio ${avg} kcal &nbsp;·&nbsp; Meta ${TARGETS.kcal} kcal</div>
    </div>`;
  }

  html += `<div style="font-size:10px;font-weight:700;color:#aaa;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px">${history.length} dias guardados</div>`;

  html += history.map(d=>{
    const t = dayTotals(d.meals);
    const wc = d.whoop ? (WHOOP_COLORS[d.whoop]||'#aaa') : '#aaa';
    const training = (d.training||[]).map(tid=>{ const o=TRAINING_OPTS.find(x=>x.id===tid); return o?o.label:''; }).filter(Boolean);
    return `
      <div class="hist-row">
        <div class="hist-hd">
          <span class="hist-date">${fmtDate(d.date)}</span>
          <div style="display:flex;gap:10px;align-items:center">
            ${d.whoop ? `<span style="font-size:11px;font-weight:600;color:${wc}">${d.whoop.split(' ')[0]}</span>` : ''}
            <button class="hist-del" data-action="delete-day" data-date="${d.date}">&#x2715;</button>
          </div>
        </div>
        <div class="hist-macros">
          <div><div class="hist-m-label">Kcal</div><div class="hist-m-val">${r0(t.kcal)}</div></div>
          <div><div class="hist-m-label">Prot</div><div class="hist-m-val" style="color:#16a34a">${r0(t.prot)}g</div></div>
          <div><div class="hist-m-label">Carbs</div><div class="hist-m-val" style="color:#2563eb">${r0(t.carbs)}g</div></div>
          <div><div class="hist-m-label">Grasa</div><div class="hist-m-val" style="color:#d97706">${r0(t.fat)}g</div></div>
        </div>
        ${training.length ? `<div class="hist-tags">${training.map(l=>`<span class="hist-tag">${l}</span>`).join("")}</div>` : ''}
        <div class="hist-meta">
          ${d.weight ? `<span class="hist-meta-item">${d.weight} kg</span>` : ''}
          ${d.hrv    ? `<span class="hist-meta-item">HRV ${d.hrv} ms</span>` : ''}
          ${d.steps  ? `<span class="hist-meta-item">${parseInt(d.steps).toLocaleString()} pasos</span>` : ''}
          ${d.water  ? `<span class="hist-meta-item">${d.water*250} ml agua</span>` : ''}
        </div>
        ${d.note ? `<div class="hist-note">${d.note}</div>` : ''}
      </div>`;
  }).join("");
  return html;
}

// ─── PICKER ──────────────────────────────────────────────────────────────────
function renderPicker() {
  const search = S.pickerSearch.toLowerCase();
  let filtered;
  if(search) {
    filtered={};
    Object.entries(CATALOGO).forEach(([cat,items])=>{ const f=items.filter(i=>i.nombre.toLowerCase().includes(search)); if(f.length) filtered[cat]=f; });
  } else { filtered={[S.pickerCat]:CATALOGO[S.pickerCat]}; }

  let root = document.getElementById("picker-root");
  if(!root) { root=document.createElement("div"); root.id="picker-root"; document.body.appendChild(root); }
  root.innerHTML = `
    <div class="picker-overlay">
      <div class="picker">
        <div class="picker-hd">
          <div class="picker-title">Catalogo</div>
          <button class="picker-close" data-action="close-picker">×</button>
        </div>
        <div class="picker-search-wrap">
          <input type="text" id="picker-search" class="picker-search" placeholder="Buscar..." value="${S.pickerSearch}">
        </div>
        ${!search ? `<div class="cat-tabs">${Object.keys(CATALOGO).map(c=>`<button class="cat-tab ${S.pickerCat===c?'on':''}" data-action="cat-tab" data-cat="${c}">${c}</button>`).join("")}</div>` : ''}
        <div class="food-list">
          ${Object.entries(filtered).map(([cat,items])=>`
            ${search?`<div class="food-cat-label">${cat}</div>`:''}
            ${items.map(f=>`
              <button class="food-btn" data-action="pick-food" data-food="${f.id}">
                <div><div class="food-fname">${f.nombre}</div><div class="food-finfo">${f.base} ${f.unidad} · ${f.kcal} kcal · P ${f.prot}g</div></div>
                <span class="food-add">+</span>
              </button>`).join("")}
          `).join("")||'<div class="empty">Sin resultados</div>'}
        </div>
      </div>
    </div>`;
  bindPickerEvents();
}

function closePicker() { S.picker=null; S.pickerSearch=""; const el=document.getElementById("picker-root"); if(el) el.remove(); }

// ─── EVENTS ──────────────────────────────────────────────────────────────────
function bindEvents() {
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick=()=>{ S.tab=b.dataset.tab; render(); });

  document.querySelectorAll("[data-action]").forEach(el => {
    const a = el.dataset.action;

    if(a==="toggle-log") el.onclick=()=>{
      const i=+el.dataset.idx, m=S.day.meals[i];
      m.logged=!m.logged; if(!m.logged){m.custom=false;m.items=[];}
      S.saved=false; render();
    };
    else if(a==="expand") el.onclick=()=>{
      const i=+el.dataset.idx;
      if(S.day.meals[i].logged){ S.expanded[i]=!S.expanded[i]; render(); }
    };
    else if(a==="toggle-custom") el.onclick=()=>{
      const i=+el.dataset.idx; S.day.meals[i].custom=!S.day.meals[i].custom;
      S.expanded[i]=true; S.saved=false; render();
    };
    else if(a==="open-picker") el.onclick=()=>{
      S.picker=+el.dataset.idx; S.pickerSearch=""; S.pickerCat=Object.keys(CATALOGO)[0]; renderPicker();
    };
    else if(a==="remove-item") el.onclick=()=>{
      S.day.meals[+el.dataset.meal].items.splice(+el.dataset.item,1); S.saved=false; render();
    };
    else if(a==="qty") el.onchange=()=>{
      S.day.meals[+el.dataset.meal].items[+el.dataset.item].qty=parseFloat(el.value)||0; S.saved=false; render();
    };
    else if(a==="water") el.onclick=()=>{
      const v=+el.dataset.v;
      S.day.water = S.day.water===v ? v-1 : v;
      S.saved=false;
      saveDay(S.activeDate || today, S.day).catch(()=>{}); // auto-save water
      render();
    };
    else if(a==="training") el.onclick=()=>{
      const tid=el.dataset.tid;
      let tr=[...(S.day.training||[])];
      if(tid==="descanso") { tr=tr.includes("descanso")?[]:["descanso"]; }
      else { tr=tr.filter(t=>t!=="descanso"); tr=tr.includes(tid)?tr.filter(t=>t!==tid):[...tr,tid]; }
      S.day.training=tr; S.saved=false; render();
    };
    else if(a==="delete-day") el.onclick=async()=>{
      const date=el.dataset.date;
      if(confirm("Borrar el dia "+fmtDate(date)+"? Esta accion no se puede deshacer.")) {
        await deleteDay(date); showToast("Dia borrado"); render();
      }
    };
    else if(a==="save-btn") {} // handled below
  });

  // Fields
  document.querySelectorAll("[data-action='switch-date']").forEach(b => b.onclick=async()=>{
    const date = b.dataset.date;
    S.loading = true; render();
    const loaded = (await loadDay(date)) || emptyDay();
    loaded.meals = loaded.meals.map(m=>({items:[],...m}));
    S.day = loaded;
    S.activeDate = date;
    S.expanded = {};
    S.saved = false;
    S.loading = false;
    render();
  });

  const weight=document.getElementById("weight"); if(weight) weight.onchange=()=>{S.day.weight=weight.value;S.saved=false;};
  const steps=document.getElementById("steps"); if(steps) steps.onchange=()=>{S.day.steps=steps.value;S.saved=false;};
  const whoop=document.getElementById("whoop"); if(whoop) whoop.onchange=()=>{S.day.whoop=whoop.value;S.saved=false;render();};
  const note=document.getElementById("note"); if(note) note.onchange=()=>{S.day.note=note.value;S.saved=false;};
  const hrv=document.getElementById("hrv"); if(hrv) hrv.onchange=()=>{S.day.hrv=hrv.value;S.saved=false;};

  const sb=document.getElementById("save-btn");
  if(sb) sb.onclick=()=>{ doSave(); };

  const eb=document.getElementById("export-btn"); if(eb) eb.onclick=exportData;
  const ib=document.getElementById("import-btn"); if(ib) ib.onclick=()=>document.getElementById("import-file").click();
  const ifi=document.getElementById("import-file"); if(ifi) ifi.onchange=importData;
}

function bindPickerEvents() {
  document.querySelectorAll("[data-action='close-picker']").forEach(b=>b.onclick=closePicker);
  document.querySelectorAll("[data-action='cat-tab']").forEach(b=>b.onclick=()=>{ S.pickerCat=b.dataset.cat; renderPicker(); });
  document.querySelectorAll("[data-action='pick-food']").forEach(b=>b.onclick=()=>{
    const f=findFood(b.dataset.food); if(!f) return;
    S.day.meals[S.picker].items.push({catalogId:f.id,qty:f.base});
    S.saved=false; closePicker(); render();
  });
  const ps=document.getElementById("picker-search");
  if(ps){ ps.oninput=()=>{ S.pickerSearch=ps.value; renderPicker(); document.getElementById("picker-search").focus(); }; }
}

// ─── BACKUP ──────────────────────────────────────────────────────────────────
function exportData() {
  const d=new Date(), all=loadAllDays();
  const date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const blob=new Blob([JSON.stringify({exported:d.toISOString(),days:all},null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=`tracker-backup-${date}.json`; a.click(); URL.revokeObjectURL(url);
  showToast("Backup descargado");
}
function importData(e) {
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try {
      const data=JSON.parse(ev.target.result);
      if(!data.days||!Array.isArray(data.days)) throw new Error("Formato invalido");
      if(!confirm("Importar "+data.days.length+" dias?")) return;
      data.days.forEach(d=>{ const{date,...rest}=d; if(date) saveDay(date,rest); });
      S.day=loadDay(today)||emptyDay(); S.day.meals=S.day.meals.map(m=>({items:[],...m}));
      render(); showToast(data.days.length+" dias importados");
    } catch(err){ alert("Error: "+err.message); }
  };
  reader.readAsText(file); e.target.value="";
}

function showToast(msg) {
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2000);
}

// ─── INIT ────────────────────────────────────────────────────────────────────
async function initApp() {
  S.loading = true;
  S.authError = false;
  render();
  // Wait for GIS library to load (max 4 seconds)
  let attempts = 0;
  while (typeof google === "undefined" || !google.accounts) {
    if (attempts++ > 20) { S.loading=false; S.authError=true; render(); return; }
    await new Promise(r => setTimeout(r, 200));
  }
  try {
    await ensureAuth();
    await ensureHeaders();
    const todayStr = TODAY();
    const d = await loadDay(todayStr);
    S.day = d || emptyDay();
    S.day.meals = S.day.meals.map(m => ({ items:[], ...m }));
    S.activeDate = todayStr;
    S.loading = false;
    render();
  } catch(e) {
    console.error("Init error:", e);
    S.loading = false;
    S.authError = true;
    render();
  }
}

async function doSave() {
  const w=document.getElementById("weight"), st=document.getElementById("steps"),
        n=document.getElementById("note"), wh=document.getElementById("whoop"),
        hv=document.getElementById("hrv");
  if(w)  S.day.weight = w.value;
  if(st) S.day.steps  = st.value;
  if(n)  S.day.note   = n.value;
  if(wh) S.day.whoop  = wh.value;
  if(hv) S.day.hrv    = hv.value;
  const sb = document.getElementById("save-btn");
  if(sb) { sb.textContent="Guardando..."; sb.disabled=true; }
  await saveDay(S.activeDate || TODAY(), S.day);
  S.saved = true;
  render();
  showToast("Guardado en Sheets");
  setTimeout(()=>{ S.saved=false; }, 2500);
}

window.addEventListener("load", () => {
  initApp();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
});
</script>
